name: PacBio WGS Singleton
description: Run PacBio WGS analysis on a single sample.

selected_requirements_configuration: Nominal Genomes
requirements_configurations:
  - name: Nominal Genomes
    description: Standard requirements for typical genome analysis
  - name: High Depth Genomes
    description: Requirements for high depth genome sequencing

stages:
  - name: Prepare Directories
    description: Prepare output directories
    task_path: tasks/prepare_directories.task.yaml
    depends_on: []

    task_parameters:
      - name: input_tsv
        label: Batch TSV File
        type: file
        pattern_match:
          - '*.tsv'
        help: "The batch file containing a list of FASTQ or uBAM (unaligned BAM), including failed target uBAMs, files to align and their associated samples."

      - name: folder_name
        label: Folder Name
        type: string
        optional: true
        help: "The name of the output folder. If left blank, the name of the folder containing the batch TSV file will be used."

      - name: base_output_folder
        label: Base Output Folder
        type: directory
        supports_location_mode: 'no_append'
        persist_key: "pacbio_wgs.base_output_folder"
        help: "The base output folder, where the output folder will be created, for the PacBio WGS analysis."

  - name: pbmm2 Alignment
    description: Align PacBio HiFi reads to a reference genome using pbmm2 aligner.
    task_path: tasks/pbmm2.task.yaml
    depends_on:
      - Prepare Directories

    batch_file_parameter:
      label: HiFi Reads Alignment Files TSV
      path:
        base_path:
          type: stage
          stage: Prepare Directories
          parameter: input_tsv
        file: ''
      help: "The batch file containing a list of FASTQ or uBAM (unaligned BAM), including failed target uBAMs, files to align and their associated samples."

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Prepare Directories
        stage_parameter_expression: "${output_folder}"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: boolean
        value: true

  - name: Merge BAMs
    description: Merge BAM files for a given sample. 
    task_path: tasks/merge_bams.task.yaml
    depends_on:
      - pbmm2 Alignment

    glob_parameter:
      label: Input Folder
      path:
        type: stage
        stage: pbmm2 Alignment
        parameter: output_folder
      glob_ex: '**/*.*.aligned.bam'
      output_parameters:
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: input_folder
        label: Input Folder
        type: stage
        stage: pbmm2 Alignment
        stage_parameter_expression: "${output_folder}"
        supports_location_mode: 'read_only'

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: pbmm2 Alignment
        stage_parameter_expression: "${cache_udocker_images}"
        value: true

  - name: DeepVariant
    description: Call variants from PacBio HiFi reads using DeepVariant.
    task_path: tasks/deepvariant.task.yaml
    depends_on:
      - Merge BAMs

    glob_parameter:
      label: Alignment Folder
      path: 
        type: stage
        stage: Merge BAMs
        parameter: input_folder
      glob_ex: '**/*.aligned.bam'
      output_parameters:
        - task_parameter_name: aligned_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${input_folder}"
      
      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${cache_udocker_images}"

  - name: mosdepth
    description: Calculate depth of coverage for BAM.
    task_path: tasks/mosdepth.task.yaml
    depends_on:
      - Merge BAMs

    glob_parameter:
      label: Alignment Folder
      path: 
        type: stage
        stage: Merge BAMs
        parameter: input_folder
      glob_ex: '**/*.aligned.bam'
      output_parameters:
        - task_parameter_name: aligned_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${input_folder}"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${cache_udocker_images}"

      - name: infer_sex
        label: Infer Sex?
        type: boolean
        value: true

  - name: Sawfish
    description: Discover and call structural variants with Sawfish.
    task_path: tasks/sawfish.task.yaml
    depends_on:
      - DeepVariant
      - mosdepth

    glob_parameter:
      label: Alignment Folder
      path: 
        type: stage
        stage: Merge BAMs
        parameter: input_folder
      glob_ex: '**/*.aligned.bam'
      output_parameters:
        - task_parameter_name: aligned_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${input_folder}"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${cache_udocker_images}"

  - name: Merge in Failed Reads
    description: Merge BAM files for a given sample. 
    task_path: tasks/merge_bams.task.yaml
    depends_on:
      - Sawfish
      - mosdepth
      - Paraphase
      - Mitorsaw

    glob_parameter:
      label: Input Folder
      path:
        type: stage
        stage: pbmm2 Alignment
        parameter: output_folder
      glob_ex: '**/*.*.bam'
      output_parameters:
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: input_folder
        label: Input Folder
        type: stage
        stage: Prepare Directories
        stage_parameter_expression: "${output_folder}"
        supports_location_mode: 'read_only'

      - name: merge_failed_reads
        label: Merge Failed Reads
        type: stage
        stage: Merge in Failed Reads
        stage_parameter_expression: "true"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: pbmm2 Alignment
        stage_parameter_expression: "${cache_udocker_images}"
        value: true

  - name: TRGT
    description: Genotype tandem repeats from aligned reads using TRGT.
    task_path: tasks/trgt.task.yaml
    depends_on:
      - Merge in Failed Reads

    glob_parameter:
      label: Alignment Folder
      path: 
        type: stage
        stage: Merge in Failed Reads
        parameter: input_folder
      glob_ex: '**/*.aligned.bam'
      output_parameters:
        - task_parameter_name: aligned_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Merge in Failed Reads
        stage_parameter_expression: "${input_folder}"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: pbmm2 Alignment
        stage_parameter_expression: "${cache_udocker_images}"

  - name: Paraphase
    description: Haplotype genes in hard to align regions using Paraphase.
    task_path: tasks/paraphase.task.yaml
    depends_on:
      - Merge BAMs

    glob_parameter:
      label: Alignment Folder
      path: 
        type: stage
        stage: Merge BAMs
        parameter: input_folder
      glob_ex: '**/*.aligned.bam'
      output_parameters:
        - task_parameter_name: aligned_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${input_folder}"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${cache_udocker_images}"

  - name: Mitorsaw
    description: Identify and quantify mitochondrial variants and haplotypes from aligned BAM files using Mitorsaw.
    task_path: tasks/mitorsaw.task.yaml
    depends_on:
      - Merge BAMs
      - mosdepth

    glob_parameter:
      label: Alignment Folder
      path: 
        type: stage
        stage: Merge BAMs
        parameter: input_folder
      glob_ex: '**/*.aligned.bam'
      output_parameters:
        - task_parameter_name: aligned_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${input_folder}"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: Merge BAMs
        stage_parameter_expression: "${cache_udocker_images}"

  - name: HiPhase
    description: Phase VCFs and haplotag BAMs with HiPhase.
    task_path: tasks/hiphase.task.yaml
    depends_on:
      - TRGT
      
    glob_parameter:
      label: Alignment Folder
      path: 
        type: stage
        stage: DeepVariant
        parameter: output_folder
      glob_ex: '**/*.aligned.bam'
      output_parameters:
        - task_parameter_name: aligned_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Prepare Directories
        stage_parameter_expression: "${output_folder}"

  - name: CpG and MethBat Analysis
    description: Generate CpG methylation scores and perform methylation analysis.
    task_path: tasks/cpg_and_methbat.task.yaml
    depends_on:
      - HiPhase

    glob_parameter:
      label: Alignment Folder
      path:
        type: stage
        stage: HiPhase
        parameter: output_folder
      glob_ex: '**/*.haplotagged.bam'
      output_parameters:
        - task_parameter_name: haplotagged_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: pbmm2 Alignment
        stage_parameter_expression: "${output_folder}"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: pbmm2 Alignment
        stage_parameter_expression: "${cache_udocker_images}"

  - name: Secondary Analysis Stats
    description: Generate secondary analysis statistics.
    task_path: tasks/stats.task.yaml
    depends_on:
      - HiPhase

    glob_parameter:
      label: Alignment Folder
      path:
        type: stage
        stage: HiPhase
        parameter: output_folder
      glob_ex: '**/*.haplotagged.bam'
      output_parameters:
        - task_parameter_name: haplotagged_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Prepare Directories
        stage_parameter_expression: "${output_folder}"

      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: pbmm2 Alignment
        stage_parameter_expression: "${cache_udocker_images}"

  - name: PBStarPhase
    description: Run PBStarPhase to generate diplotype calls and PharmCAT TSV output.
    task_path: tasks/pbstarphase.task.yaml
    depends_on:
      - HiPhase

    glob_parameter:
      label: Alignment Folder
      path:
        type: stage
        stage: HiPhase
        parameter: output_folder
      glob_ex: '**/*.haplotagged.bam'
      output_parameters:
        - task_parameter_name: haplotagged_bam
          expression: '${0}'
        - task_parameter_name: sample_id
          expression: '${2}'

    task_parameters:
      - name: output_folder
        label: Output Folder
        type: stage
        stage: Prepare Directories
        stage_parameter_expression: "${output_folder}"
        
      - name: cache_udocker_images
        label: Cache Udocker Image
        type: stage
        stage: pbmm2 Alignment
        stage_parameter_expression: "${cache_udocker_images}"

  - name: Upload PGx Results
    description: Upload PacBio PGx Results to Sample Catalog
    task_path: tasks/upload_pgx_results.task.yaml
    depends_on:
      - PBStarPhase

    glob_parameter:
      label: Analysis Folder
      path:
        type: stage
        stage: PBStarPhase
        parameter: output_folder
      glob_ex: '**/*.pharmcat.tsv'
      output_parameters:
        - task_parameter_name: pharmcat_tsv
          expression: '${0}'
        - task_parameter_name: sample_name
          expression: '${2}'
  
  - name: VSPipeline
    description: Create a project with called variants
    run_step: optional_default_skip
    task_path: tasks/vspipeline.task.yaml
    depends_on:
      - HiPhase
      - Mitorsaw
      - Upload PGx Results

    task_parameters:
      - name: base_path
        label: Input Folder
        type: stage
        stage: Prepare Directories
        stage_parameter_expression: "${output_folder}"

      - name: project_name
        label: Project Name
        type: string
        optional: true
        help: "The name of the VarSeq project to create. If not provided, the project name will be derived from the sample name derived from the glob expression."

      - name: project_template
        label: VarSeq Project Template
        type: file
        supports_location_mode: 'read_only'
        help: "The template to use for the VarSeq project."
        path: AppData/VarSeq/User Data/ProjectTemplates/
        value: AppData/VarSeq/User Data/ProjectTemplates/PacBio_WDL.vsproject-template

      - name: overwrite_project
        label: Overwrite Existing VarSeq Projects
        type: boolean
        value: "true"
        help: "If enabled, existing VarSeq projects with the same name will be overwritten."