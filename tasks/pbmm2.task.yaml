name: pbmm2 Alignment
description: Align PacBio HiFi reads to a reference genome using pbmm2 aligner.

agent_requirements:
  cpu_cores: 48
  memory_gb: 96

parameters:
  - name: sample_id
    label: Sample ID
    type: string
    optional: false

  - name: bam
    label: HiFi reads (BAM)
    help: Unaligned BAM (uBAM) PacBio HiFi reads
    type: file

  - name: output_folder
    label: Output Folder
    type: directory
    supports_location_mode: 'no_append'

  - name: cache_udocker_images
    label: Cache Udocker Image
    type: boolean
    value: true
    group: Advanced Options

steps:
- name: pbmm2_alignment
  type: cmd
  description: Run pbmm2 alignment workflow
  args:
      - |- # shell
        set -eu pipefail
        
        # Function to handle miniwdl failure
        handle_miniwdl_failure() {
          local exit_code=$1
          echo "MiniWDL run failed with exit code $exit_code"
          echo "Capturing debug information..."
          bash "$TASK_DIR/miniwdl-debug-capture.sh" /scratch/_LAST "$output_folder" "$TASK_NAME"
          exit $exit_code
        }
        
        # Set up resource paths based on resources_path
        PB_RESOURCES_DIR="${WORKSPACE_DIR}/${RESOURCES_PATH}/hifi-wdl-resources-v3.1.0"

        # Set environment variables for miniwdl
        export MINIWDL__SCHEDULER__CONTAINER_BACKEND=udocker
        export MINIWDL__FILE_IO__ALLOW_ANY_INPUT=true
        export MINIWDL__SCHEDULER__TASK_CONCURRENCY=8
        export UDOCKER_DIR=/scratch/.udocker
        
        # Extract reference file paths from the template
        REF_FASTA="$PB_RESOURCES_DIR/GRCh38/human_GRCh38_no_alt_analysis_set.fasta"
        REF_INDEX="$PB_RESOURCES_DIR/GRCh38/human_GRCh38_no_alt_analysis_set.fasta.fai"
        
        # Verify reference files exist
        if [ ! -f "$REF_FASTA" ]; then
          echo "Error: Reference FASTA file not found at $REF_FASTA"
          echo "Please ensure the PacBio WDL resources have been downloaded using the Download PacBio Reference Data Resources task"
          exit 1
        fi
        
        if [ ! -f "$REF_INDEX" ]; then
          echo "Error: Reference FASTA index file not found at $REF_INDEX"
          echo "Please ensure the PacBio WDL resources have been downloaded using the Download PacBio Reference Data Resources task"
          exit 1
        fi
        
        # Copy reference files to /scratch
        echo "Copying reference files to /scratch..."
        cp "$REF_FASTA" /scratch/
        cp "$REF_INDEX" /scratch/
        LOCAL_REF_FASTA="/scratch/$(basename "$REF_FASTA")"
        LOCAL_REF_INDEX="/scratch/$(basename "$REF_INDEX")"
        
        echo "*************************"
        echo "Starting pbmm2 alignment for $sample_id"
        echo "Space on agent: $(df -h /scratch | tail -n 1 | awk '{print $4}')"
        echo "Input Parameters:"
        echo "  - sample_id: $sample_id"
        echo "  - bam: $bam"
        echo "  - output_folder: $output_folder"
        echo "  - cache_udocker_images: $cache_udocker_images"
        echo "*************************"

        # Pull udocker layers from cache if requested
        if [ -d "${WORKSPACE_DIR}/${RESOURCES_PATH}/udocker_cache/${TASK_NAME}" ]; then
          echo "Pulling udocker image from cache..."
          mkdir -p /scratch/.udocker
          cp -R "${WORKSPACE_DIR}/${RESOURCES_PATH}/udocker_cache/${TASK_NAME}"/* /scratch/.udocker/ || \
            { echo "Failed to copy udocker cache to /scratch/.udocker; will pull layers instead"; }
        fi
        
        # Generate pbmm2 input JSON using jq
        echo "================================================"
        echo "🚀 STARTING PBMM2 ALIGNMENT"
        echo "================================================"
        echo "📅 Server Time: $(date)"
        echo "📁 Input Files:"
        echo "  - HiFi BAM: $(basename "$bam")"
        echo "  - Reference FASTA: $(basename "$LOCAL_REF_FASTA")"
        echo "  - Reference FASTA Index: $(basename "$LOCAL_REF_INDEX")"
        echo "⚙️  Configuration:"
        echo "  - Threads: $AGENT_CPU_CORES"
        echo "  - Memory: ${AGENT_MEMORY_GB}G"
        echo "  - Max Reads Per Chunk: 0 (no scattering)"
        echo "================================================"
        
        # Record start time
        PBMM2_START_TIME=$(date +%s)
        
        jq -n \
          --arg sample_id "$sample_id" \
          --arg bam "$bam" \
          --argjson max_reads_per_chunk 0 \
          --arg ref_fasta "$LOCAL_REF_FASTA" \
          --arg ref_index "$LOCAL_REF_INDEX" \
          --arg ref_name "GRCh38" \
          '{
            "pbmm2.sample_id": $sample_id,
            "pbmm2.bam": $bam,
            "pbmm2.max_reads_per_chunk": $max_reads_per_chunk,
            "pbmm2.ref_fasta": $ref_fasta,
            "pbmm2.ref_index": $ref_index,
            "pbmm2.ref_name": $ref_name,
            "pbmm2.default_runtime_attributes": {
              "backend": "HPC",
              "preemptible_tries": 0,
              "max_retries": 3,
              "zones": "",
              "cpuPlatform": "",
              "gpuType": "",
              "container_registry": "quay.io/pacbio"
            }
          }' > /scratch/inputs.json

        # Run miniwdl and capture exit code, but don't exit on failure
        echo "Running pbmm2 alignment..."
        set +e
        miniwdl run \
          "${TASK_DIR}/wdl/wdl-common/wdl/workflows/pbmm2/pbmm2.wdl" \
          --dir /scratch \
          --runtime-cpu-max=$AGENT_CPU_CORES \
          --runtime-memory-max=${AGENT_MEMORY_GB}G \
          -i /scratch/inputs.json 
        
        MINIWDL_EXIT_CODE=$?
        set -e

        # Post-execution logging for pbmm2
        PBMM2_END_TIME=$(date +%s)
        PBMM2_DURATION=$((PBMM2_END_TIME - PBMM2_START_TIME))
        PBMM2_DURATION_HOUR=$((PBMM2_DURATION / 3600))
        PBMM2_DURATION_MIN=$(((PBMM2_DURATION % 3600) / 60))
        PBMM2_DURATION_SEC=$((PBMM2_DURATION % 60))
        
        echo "================================================"
        echo "✅ PBMM2 ALIGNMENT COMPLETED SUCCESSFULLY"
        echo "================================================"
        echo "⏱️  Execution Time: ${PBMM2_DURATION_HOUR}h ${PBMM2_DURATION_MIN}m ${PBMM2_DURATION_SEC}s"
        echo "💾 Remaining Disk Space: $(df -h /scratch | tail -n 1 | awk '{print $4}')"
        echo "================================================"

        # Copy udocker cache to output folder
        if [ "$cache_udocker_images" = true ] && [ ! -d "${WORKSPACE_DIR}/${RESOURCES_PATH}/udocker_cache/${TASK_NAME}" ]; then
          echo "Copying udocker cache to resources folder..."
          mkdir -p "${WORKSPACE_DIR}/${RESOURCES_PATH}/udocker_cache/${TASK_NAME}"
          cp -r /scratch/.udocker/layers /scratch/.udocker/repos "${WORKSPACE_DIR}/${RESOURCES_PATH}/udocker_cache/${TASK_NAME}" 2>/dev/null || true
        fi

        # Process all files and values in outputs.json
        bash "$TASK_DIR/process-outputs.sh" "$output_folder" "$sample_id" 

        if [ $MINIWDL_EXIT_CODE -ne 0 ]; then
          echo "MiniWDL run failed with exit code $MINIWDL_EXIT_CODE"
          handle_miniwdl_failure $MINIWDL_EXIT_CODE
        fi
        
        echo "*************************"
        echo "pbmm2 alignment completed successfully"
        echo "Space on agent: $(df -h /scratch | tail -n 1 | awk '{print $4}')"
        echo "Output files copied to: $output_folder"
        echo "*************************"